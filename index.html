<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cine Lanka | Movies & Trailers</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #101010;
  color: white;
}

header {
  background: #191919;
  padding: 20px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
}

.logo {
  color: #ff3434;
  font-size: 27px;
  font-weight: bold;
}

nav a {
  color: white;
  text-decoration: none;
  margin: 8px;
}

nav a:hover {
  color: #ff3434;
}

.hero {
  padding: 65px 20px;
  text-align: center;
  background: linear-gradient(135deg, #310707, #101010);
}

.hero h1 {
  font-size: 38px;
}

.hero p {
  color: #ccc;
}

input {
  padding: 13px;
  width: min(90%, 400px);
  border-radius: 7px;
  border: none;
  margin-top: 15px;
}

h2 {
  padding: 0 20px;
}

.movies {
  display: grid;
  grid-template-columns: repeat(
    auto-fit, minmax(145px, 1fr)
  );
  gap: 18px;
  padding: 20px;
}

.movie {
  background: #202020;
  border-radius: 10px;
  overflow: hidden;
  transition: 0.2s;
}

.movie:hover {
  transform: translateY(-5px);
}

.movie img {
  width: 100%;
  height: 230px;
  object-fit: cover;
}

.movie h3 {
  font-size: 16px;
  padding: 0 10px;
}

.movie p {
  color: #bbb;
  padding: 0 10px;
  font-size: 13px;
}

.movie button {
  margin: 10px;
  padding: 10px;
  background: #ed2929;
  color: white;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

footer {
  background: #191919;
  padding: 25px;
  text-align: center;
  color: #aaa;
}
</style>
</head>

<body>

<header>
  <div class="logo">🎬 Cine Lanka</div>
  <nav>
    <a href="#home">Home</a>
    <a href="#movies">Movies</a>
    <a href="#about">About</a>
  </nav>
</header>

<section class="hero" id="home">
  <h1>Discover Amazing Movies</h1>
  <p>Find movies, watch trailers and explore cinema.</p>
  <input
    id="search"
    type="text"
    placeholder="Search movies..."
    oninput="searchMovies()"
  >
</section>

<h2 id="movies">🔥 Popular Movies</h2>

<section class="movies" id="movieList"></section>

<footer id="about">
  <h3>Cine Lanka</h3>
  <p>Discover movies and official trailers.</p>
  <p>© 2026 Cine Lanka</p>
</footer>

<script>
const movies = [
  {
    title: "Inception",
    year: "2010",
    genre: "Sci-Fi",
    image: "https://image.tmdb.org/t/p/w500/oYuLEt3zVCKq57qu2F8dT7NIa6f.jpg",
    trailer: "https://www.youtube.com/results?search_query=Inception+official+trailer"
  },
  {
    title: "Interstellar",
    year: "2014",
    genre: "Sci-Fi",
    image: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",
    trailer: "https://www.youtube.com/results?search_query=Interstellar+official+trailer"
  },
  {
    title: "The Dark Knight",
    year: "2008",
    genre: "Action",
    image: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg",
    trailer: "https://www.youtube.com/results?search_query=The+Dark+Knight+official+trailer"
  },
  {
    title: "Avatar",
    year: "2009",
    genre: "Adventure",
    image: "https://image.tmdb.org/t/p/w500/kyeqWdyUXW608qlYkRqosgbbJyK.jpg",
    trailer: "https://www.youtube.com/results?search_query=Avatar+official+trailer"
  },
  {
    title: "Titanic",
    year: "1997",
    genre: "Romance",
    image: "https://image.tmdb.org/t/p/w500/9xjZS2rlVxm8SFx8kPC3aIGCOYQ.jpg",
    trailer: "https://www.youtube.com/results?search_query=Titanic+official+trailer"
  },
  {
    title: "Avengers Endgame",
    year: "2019",
    genre: "Action",
    image: "https://image.tmdb.org/t/p/w500/or06FN3Dka5tukK1e9sl16pB3iy.jpg",
    trailer: "https://www.youtube.com/results?search_query=Avengers+Endgame+official+trailer"
  }
];

function displayMovies(list) {
  const container = document.getElementById("movieList");

  container.innerHTML = list.map(movie => `
    <article class="movie">
      <img
        src="${movie.image}"
        alt="${movie.title} poster"
        loading="lazy"
      >
      <h3>${movie.title}</h3>
      <p>${movie.year} · ${movie.genre}</p>
      <button onclick="window.open('${movie.trailer}', '_blank')">
        Watch Trailer
      </button>
    </article>
  `).join("");
}

function searchMovies() {
  const query = document.getElementById("search")
    .value.toLowerCase();

  const filtered = movies.filter(movie =>
    movie.title.toLowerCase().includes(query) ||
    movie.genre.toLowerCase().includes(query)
  );

  displayMovies(filtered);
}

displayMovies(movies);
</script>

</body>
</html>
